<!DOCTYPE html>
<html lang="en">
<head>
<style>
  body { font-family: Arial, sans-serif; padding: 30px; background: #f7f7f7; }
  table { border-collapse: collapse; width: 100%; background: white; margin-top: 20px; }
  th { background: #333; color: white; text-align: left; padding: 12px; }
  td { padding: 12px; border-bottom: 1px solid #ddd; }
  input, button { padding: 10px; margin-right: 8px; }
</style>
</head>
<body>
  <h1>Manage treatments</h1>
  <form action="/manage" method="POST">
    <input name="name" placeholder="Treatment name" required>
    <input name="price" placeholder="Price e.g. £150" required>
    <button type="submit">Add treatment</button>
  </form>
  <table>
    <tr>
      <th>Treatment</th>
      <th>Price</th>
    </tr>
    {% for t in treatments %}
    <tr>
      <td>{{ t[0] }}</td>
      <td>{{ t[1] }}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
