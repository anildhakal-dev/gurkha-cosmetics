<!DOCTYPE html>
<html lang="en">
<head>
<style>
  body { font-family: Arial, sans-serif; padding: 30px; background: #f7f7f7; }
  table { border-collapse: collapse; width: 100%; background: white; margin-top: 20px; }
  th { background: #333; color: white; text-align: left; padding: 12px; }
  td { padding: 12px; border-bottom: 1px solid #ddd; }
  .total { font-size: 28px; font-weight: bold; margin-top: 10px; }
</style>
</head>
<body>
  <h1>Stats</h1>
  <p><a href="/enquiries">Enquiries</a> | <a href="/manage">Treatments</a> | <a href="/money">Money</a> | <a href="/stats">Stats</a> | <a href="/settings">Settings</a> | <a href="/logout">Log out</a></p>
  <div class="total">Total enquiries: {{ total }}</div>
  <h2>Where clients come from</h2>
  <table>
    <tr>
      <th>Source</th>
      <th>Enquiries</th>
    </tr>
    {% for s in sources %}
    <tr>
      <td>{{ s[0] }}</td>
      <td>{{ s[1] }}</td>
    </tr>
    {% endfor %}
  </table>
  <div style="max-width: 400px; margin-top: 30px; background: white; padding: 20px;">
    <canvas id="sourceChart"></canvas>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    const labels = [{% for s in sources %}{{ s[0]|tojson }},{% endfor %}];
    const counts = [{% for s in sources %}{{ s[1] }},{% endfor %}];
    new Chart(document.getElementById("sourceChart"), {
      type: "pie",
      data: { labels: labels, datasets: [{ data: counts }] }
    });
  </script>
</body>
</html>
