<!DOCTYPE html>
<html lang="en">
<head>
<style>
  body { font-family: Arial, sans-serif; padding: 30px; background: #f7f7f7; }
  label { display: block; margin-top: 15px; font-weight: bold; }
  input { padding: 10px; width: 350px; margin-top: 5px; }
  button { padding: 10px 20px; margin-top: 20px; }
</style>
</head>
<body>
  <h1>Website settings</h1>
  <p><a href="/enquiries">Enquiries</a> | <a href="/manage">Treatments</a> | <a href="/money">Money</a> | <a href="/stats">Stats</a> | <a href="/settings">Settings</a> | <a href="/logout">Log out</a></p>
  <p>Whatever you save here shows on the public home page.</p>
  <form action="/settings" method="POST">
    <label>Opening hours</label>
    <input name="hours" value="{{ info.get('hours', '') }}" placeholder="e.g. Mon-Sat 9am-6pm" required>
    <label>Phone number</label>
    <input name="phone" value="{{ info.get('phone', '') }}" placeholder="e.g. 07000000000" required>
    <br>
    <button type="submit">Save</button>
  </form>
</body>
</html>
