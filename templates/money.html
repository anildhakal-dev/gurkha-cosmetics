<!DOCTYPE html>
<html lang="en">
<head>
<style>
  body { font-family: Arial, sans-serif; padding: 30px; background: #f7f7f7; }
  table { border-collapse: collapse; width: 100%; background: white; margin-top: 20px; }
  th { background: #333; color: white; text-align: left; padding: 12px; }
  td { padding: 12px; border-bottom: 1px solid #ddd; }
  input, button { padding: 10px; margin-right: 8px; }
  .total { font-size: 28px; font-weight: bold; color: #1e8449; margin-top: 10px; }
</style>
</head>
<body>
  <h1>Money in</h1>
  <p><a href="/enquiries">Enquiries</a> | <a href="/manage">Treatments</a> | <a href="/money">Money</a> | <a href="/stats">Stats</a> | <a href="/logout">Log out</a></p>
  <div class="total">Total: £{{ "%.2f"|format(total) }}</div>
  <form action="/money" method="POST">
    <input name="item" placeholder="What was sold e.g. Botox" required>
    <input name="amount" type="number" step="0.01" placeholder="Amount e.g. 250" required>
    <button type="submit">Add sale</button>
  </form>
  <table>
    <tr>
      <th>Item</th>
      <th>Amount</th>
      <th>Date</th>
    </tr>
    {% for s in sales %}
    <tr>
      <td>{{ s[0] }}</td>
      <td>£{{ "%.2f"|format(s[1]) }}</td>
      <td>{{ s[2] }}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
